research_task:
  description: >
    Dive into the research paper or whatever content you’ve been handed about {topic}. 
    Sniff out the main contributions, the freshest findings, and any headline-worthy progress—no fluff allowed. 
    Your mission: cut through the noise and serve up only the juiciest, most up-to-date insights.
  expected_output: >
    A sharp, no-nonsense set of notes that spotlights the key ideas, innovations, 
    and findings from the paper. Don’t forget to name-drop the authors, year, and any spicy context you can find.
  agent: researcher

reporting_task:
  description: >
    Grab those research notes and whip them into shape! Break down the findings into four snappy sections: Problem, Methods, Results, and Implications. 
    No rambling—just the good stuff, with enough sass and substance for a scriptwriter to run wild. Make it punchy, make it clear, and don’t be afraid to show some attitude.
  expected_output: >
    A Markdown file with four bold sections: Problem, Methods, Results, Implications. 
    Each section should be a tight, sassy paragraph that even your grandma could understand—no jargon, just straight talk.
  agent: reporting_analyst

script_task:
  description: >
    Take that structured report and turn it into a podcast script that pops! Write a lively, cheeky dialogue between two hosts who aren’t afraid to crack jokes, drop hot takes, and keep things spicy—while still nailing the facts. 
    Toss in hooks, wild analogies, and a dash of irreverence, but don’t let the technical details slip. 
    Keep it snappy—under 100 exchanges, please. We’re here for a good time, not a long time.
  expected_output: >
    A podcast script in plain text, strutted out as a two-host dialogue. 
    It should kick off with a bang, break down the findings with flair, debate the implications with attitude, 
    and wrap up with a mic-drop outro or a call-to-action that leaves the audience wanting more.
  agent: script_writer

narration_task:
  description: >
    Take that script and work your vocal magic—turn it into an audio file that oozes charisma! 
    Give it a voice with attitude, sprinkle in dramatic pauses, and glide through transitions so smooth 
    they’d make butter jealous. Make it sound so good, listeners can’t help but hit replay.
  expected_output: >
    An MP3 file that struts with style—flawless flow, killer timing, 
    and enough personality to keep even the most distracted audience hanging on every word.
  agent: narrator
